set -g status-bg black
set -g status-fg red
set -g status-left ''
set -g status-right '#[fg=yellow]#H  %b %d %Y  %H:%M'
setw -g window-status-current-style fg=green

setw -g automatic-rename on
setw -g monitor-activity on
set -g visual-activity on
setw -g mode-keys vi

# change prefix to <Ctrl>a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1
setw -g aggressive-resize on

# better titles for term windows
set -g set-titles on
set -g set-titles-string "#T"

# Updated copy mode bindings for tmux 3.0+
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-no-clear "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi 'R' send -X rectangle-toggle

# Update default binding of 'Enter' to also use copy-pipe-no-clear
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-no-clear "reattach-to-user-namespace pbcopy"

bind-key a send-prefix

if-shell '[[ $(tmux -V | cut -d" " -f2) -lt 2.0 ]]' \
    'set -g mode-mouse on; set -g mouse-resize-pane on; set -g mouse-select-pane on; set -g mouse-select-window on' \
    'set -g mouse on'

bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

set-option -g synchronize-panes off
set-option -g pane-base-index 1
# Use shell name instead of absolute path to allow nested tmux sessions
# The absolute path /opt/homebrew/bin/zsh was preventing nested tmux from working
set-option -g default-shell zsh


# Vertical split (left/right) with %
bind-key % split-window -h -c "#{pane_current_path}"

# Horizontal split (top/bottom) with "
bind-key '"' split-window -v -c "#{pane_current_path}"


bind-key c new-window -c "#{pane_current_path}"

# Tmux Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect configuration
# Manual save and restore (no automatic saving)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Save and restore vim sessions
set -g @resurrect-save-vim-session 'on'

# Save and restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Change the directory where tmux-resurrect saves tmux environment
set -g @resurrect-dir '~/.tmux/resurrect'

# Restore programs that are not in the default list
set -g @resurrect-processes 'ssh mysql psql vim nvim'

# tmux-continuum configuration
# Enable auto-restore on tmux start and autosave every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'